# purge-cache.yml - AUTO CACHE REFRESH on every push to nextapply-data@main.
#
# Setup (one time, in THIS repo on GitHub):
#   Settings > Secrets and variables > Actions
#     - Secret  DATA_SYNC_WEBHOOK_TOKEN  (same value as the DATA_SYNC_WEBHOOK_TOKEN
#       env var on Netlify: Site settings > Environment variables)
#     - Variable SITE_URL = https://nextapply.co.uk  (optional, has a default)
#
# What it does on every push that changes public/data/**:
#   1. Finds the files changed in the latest public/data commit (works for manual
#      re-runs too, even after non-data commits like workflow fixes).
#   2. Purges EVERY changed file on jsDelivr (no cap, 8 parallel requests).
#   3. Calls the site webhook (POST /api/webhooks/data-sync) in BATCHES OF 50 PATHS
#      (the endpoint rejects more than 50 in one request).
#
# v2 fixes:
#   - Site webhook: chunked into 50-path batches (was: all at once -> HTTP 400
#     "Too many purge paths (max 50)")
#   - jsDelivr purge: no more 200 cap, fixed off-by-one (large uploads of 300+
#     files now fully purged), 8x parallel
#   - Manual re-run friendly: diff is based on the last public/data commit, so
#     Actions > Run workflow re-purges the latest data batch even if newer
#     commits only touched .github or README

name: Purge CDN caches

on:
  push:
    branches: [main]
    paths:
      - "public/data/**"
  workflow_dispatch: {}

concurrency:
  group: purge-cache
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed public/data files
        id: diff
        run: |
          set -e
          LAST=$(git log -n 1 --format=%H -- 'public/data/')
          PREV=$(git log -n 2 --format=%H -- 'public/data/' | tail -n 1)
          if [ -z "$LAST" ]; then
            echo "no public/data commits found"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PREV" ] || [ "$PREV" = "$LAST" ]; then
            PREV=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only "$PREV" "$LAST" -- 'public/data/**' | tee changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Purge changed files on jsDelivr (all files, 8 parallel)
        if: steps.diff.outputs.count > 0
        run: |
          TOTAL=$(grep -c . changed.txt || true)
          FAIL=$(xargs -a changed.txt -I{} -P 8 curl -s -o /dev/null -w '%{http_code}\n' \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/{}" \
            | grep -vc '^200$' || true)
          echo "jsDelivr purge attempted=$TOTAL failures=${FAIL:-0}"
          if [ "${FAIL:-0}" -gt 0 ]; then
            echo "::warning::jsDelivr purge had $FAIL failures (retry-safe: next push re-purges)"
          fi

      - name: Refresh site caches (ISR + memos + Netlify CDN) - batches of 50
        if: steps.diff.outputs.count > 0
        env:
          WEBHOOK_TOKEN: ${{ secrets.DATA_SYNC_WEBHOOK_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys

          paths = [l.strip() for l in open('changed.txt') if l.strip()]
          site = os.environ.get('SITE_URL') or 'https://nextapply.co.uk'
          token = os.environ.get('WEBHOOK_TOKEN') or ''
          CHUNK = 50  # endpoint hard limit: "Too many purge paths (max 50)."
          fails = []
          batches = (len(paths) + CHUNK - 1) // CHUNK
          for b in range(batches):
              batch = paths[b * CHUNK:(b + 1) * CHUNK]
              payload = json.dumps({"paths": batch})
              def call():
                  r = subprocess.run(
                      ['curl', '-s', '--max-time', '120', '-o', 'resp.json', '-w', '%{http_code}',
                       '-X', 'POST',
                       '-H', f'x-webhook-token: {token}',
                       '-H', 'Content-Type: application/json',
                       '-d', payload,
                       f'{site}/api/webhooks/data-sync'],
                      capture_output=True, text=True)
                  body = ''
                  if os.path.exists('resp.json'):
                      try: body = open('resp.json').read()[:150]
                      except Exception: pass
                  return (r.stdout.strip() or '000'), body
              code, body = call()
              print(f'batch {b+1}/{batches}: {len(batch)} paths -> HTTP {code} {body}')
              if code != '200':
                  code, body = call()  # one retry
                  print(f'  retry -> HTTP {code}')
                  if code != '200':
                      fails.append(f'batch {b+1} HTTP {code} {body}')
          if fails:
              for f in fails:
                  print(f'::error::Site webhook {f}')
              sys.exit(1)
          print(f'ALL {len(paths)} paths revalidated in {batches} batch(es)')
          EOF

      - name: Summary
        if: always()
        run: |
          {
            echo "## CDN purge summary"
            echo ""
            echo "- Changed public/data files: \`${{ steps.diff.outputs.count }}\`"
            echo "- jsDelivr per-file purge: all files, 8x parallel"
            echo "- Site webhook: chunked in batches of 50 (ISR + Netlify + jsDelivr core)"
          } >> "$GITHUB_STEP_SUMMARY"
