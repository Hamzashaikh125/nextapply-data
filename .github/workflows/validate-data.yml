name: Validate data

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate data
        run: |
          set -o pipefail
          node scripts/validate-data.mjs | tee validate-data.log

      - name: Publish validation report
        if: always()
        run: |
          {
            echo "## Data validation"
            echo ""
            echo '```'
            cat validate-data.log 2>/dev/null || echo "Validator did not produce a report."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
